[package]
name = "agent_harness"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "agent_harness"
path = "src/main.rs"

[dependencies]
# Async Runtime - Used by event_core, agent_loops, tool_engine for async execution
tokio = { version = "1.35", features = ["full"] }
# Async trait macros - Used by all modules for trait-based async interfaces
async-trait = "0.1"

# TUI - Used by tui_shell for rendering and input handling
ratatui = "0.24"
crossterm = "0.27"

# Memory & Zero-Copy - Used by memory_controller for direct memory access
zerocopy = { version = "0.7", features = ["derive"] }
bytemuck = "1.14"

# Serialization - Used by all modules for state persistence and message passing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling - Used by all modules for structured error types
thiserror = "1.0"
anyhow = "1.0"

# Logging - Used by all modules for tracing and debugging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# MCP (Model Context Protocol) - Placeholder until official crate stabilizes
# mcp-client = "0.1" 

# Utilities - Used across modules for IDs, timestamps, and concurrent collections
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
dashmap = "5.5"
